# Release: push to `dev` -> build the multi-arch image -> only then commit to `main`,
# tag v<version> and create the GitHub release. `main` is written by this workflow only,
# so Home Assistant never sees an update whose image is not on GHCR yet.
# Each new dev push automatically advances the published patch version.
# Can also be started by hand: Actions -> Release -> Run workflow.
name: Release

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'dev' }}
          fetch-depth: 0

      - name: Automatically bump the release version
        id: v
        run: |
          git fetch origin --tags
          version=$(python3 .github/scripts/bump_version.py)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Switch files to the stable channel
        run: python3 .github/scripts/set_channel.py apply stable

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuse dependency layers until requirements.txt changes.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: usb_manager
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/thaihoang987/addon-usb-manager:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=USB Manager Home Assistant add-on

      - name: Smoke test the image without USB hardware
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/usb-manager-smoke"
          printf '{"settle_delay_s":0,"ports":[]}' > "${RUNNER_TEMP}/usb-manager-smoke/options.json"
          docker run -d --name usb-manager-smoke --network none \
            -v "${RUNNER_TEMP}/usb-manager-smoke:/data" \
            "ghcr.io/thaihoang987/addon-usb-manager:${VERSION}"
          trap 'docker logs usb-manager-smoke; docker rm -f usb-manager-smoke' EXIT
          for attempt in $(seq 1 30); do
            if docker exec usb-manager-smoke python3 -c 'import json,urllib.request; d=json.load(urllib.request.urlopen("http://127.0.0.1:8099/api/config",timeout=2)); assert d["options"]["ports"]==[] and not d["applying"]'; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::The image did not start its Web UI with zero ports"
          exit 1

      - name: Verify the image can be downloaded publicly
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          scope = "repository:thaihoang987/addon-usb-manager:pull"
          token_url = "https://ghcr.io/token?service=ghcr.io&scope=" + scope
          with urllib.request.urlopen(token_url) as response:
              token = json.load(response)["token"]
          manifest = "https://ghcr.io/v2/thaihoang987/addon-usb-manager/manifests/" + os.environ["VERSION"]
          request = urllib.request.Request(manifest, headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json",
          })
          try:
              with urllib.request.urlopen(request) as response:
                  index = json.load(response)
          except Exception:
              raise SystemExit("Set the addon-usb-manager GitHub package visibility to Public, then rerun this workflow.")
          architectures = {entry.get("platform", {}).get("architecture") for entry in index.get("manifests", [])}
          if not {"amd64", "arm64"} <= architectures:
              raise SystemExit("Published image is missing AMD64 or ARM64")
          print("Anonymous pull works for both supported architectures")
          PY

      - name: Commit to main, tag and create the release (image is ready)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/release && cp -a . /tmp/release/ && rm -rf /tmp/release/.git
          git fetch origin main
          # -f: set_channel.py modified config.yaml on the dev tree (full copy is already in /tmp/release)
          git checkout -f -B main origin/main
          git rm -rq --ignore-unmatch .
          cp -a /tmp/release/. .
          git add -A
          git commit -m "Release ${VERSION}"
          git tag "v${VERSION}"
          git push origin main "v${VERSION}"
          python3 - <<'PY' > /tmp/notes.md
          import os, re
          text = open("usb_manager/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(os.environ['VERSION'])}\s*$(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "See CHANGELOG.md")
          PY
          gh release create "v${VERSION}" --title "USB Manager ${VERSION}" --notes-file /tmp/notes.md
